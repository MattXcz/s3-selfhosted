services:
  selfhost_s3:
    image: notifuse/selfhost_s3:latest
    container_name: selfhost_s3
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_CORS_ORIGINS: ${S3_CORS_ORIGINS:-*}
      S3_MAX_FILE_SIZE: ${S3_MAX_FILE_SIZE:-100MB}
      S3_PUBLIC_PREFIX: ${S3_PUBLIC_PREFIX:-public/}
      S3_PUBLIC_CACHE_MAX_AGE: ${S3_PUBLIC_CACHE_MAX_AGE:-31536000}
    ports:
      # naslouchá jen na localhostu -- ven jde přes Nginx Proxy Manager
      - "127.0.0.1:9000:9000"
